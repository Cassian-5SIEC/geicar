controller_server:
  ros__parameters:
    controller_frequency: 20.0
    failure_tolerance: 0.3
    use_sim_time: False
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["goal_checker"] 
    
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.40
      path_length_tolerance: 1.0
      stateful: True

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Ackermann"
      time_steps: 50
      model_dt: 0.05
      batch_size: 1000
      wz_std: 0.5
      vx_max: 1.0
      vx_std: 0.2
      AckermannConstraints:
        min_turning_r: 1.3
      vy_max: 0.0
      TrajectoryValidator:
        collision_lookahead_time: 2.0
        consider_footprint: true
      publish_critics_stats: true
      #critics: ["ConstraintCritic", "ObstaclesCritic", "PathAlignCritic","GoalCritic","GoalAngleCritic", "PathFollowCritic", "PreferForwardCritic"]
      critics: [ "ConstraintCritic", "CostCritic","PathAlignCritic","GoalCritic","GoalAngleCritic", "PathFollowCritic","PathAngleCritic"]
      # critics: [ "ConstraintCritic", "PathFollowCritic" ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      
      PathAlignCritic:
        enabled: true
        cost_weight: 8.0
        use_path_orientations: true
        threshold_to_consider: 0.5
        
      # PreferForwardCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 3.0
        # threshold_to_consider: 1.0

      GoalCritic:
        enabled: true
        cost_weight: 5.0
        threshold_to_consider: 0.5

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.8
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        use_path_orientations: True
        mode: 2

      

planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      # allow_unknown: false
      # max_iterations: 1000000
      # cache_obstacle_heuristic: true
      reverse_penalty: 1.1
      angle_quantization_bins: 95
      change_penalty: 0.1
      cost_penalty: 1.5
      tolerance: 0.5
      non_straight_penalty: 0.8
      motion_model_for_search: "REEDS_SHEPP" 
      minimum_turning_radius: 1.3
      smooth_path: True 


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[ [0.66, 0.35], [0.66, 0.15], [0.9, 0.15], [0.9, -0.08], [0.66, -0.08], [0.66, -0.35], [-0.66, -0.35], [-0.66, 0.35]  ]"
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 0.9
      always_send_full_costmap: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[ [0.66, 0.35], [0.66, 0.15], [0.9, 0.15], [0.9, -0.08], [0.66, -0.08], [0.66, -0.35], [-0.66, -0.35], [-0.66, 0.35]  ]"
      plugins: ["obstacle_layer","inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 1.2
      always_send_full_costmap: false

bt_navigator:
  ros__parameters:
    bt_loop_duration: 100

amcl:
  ros__parameters:
    map_topic: map              
    use_map_topic: True           # Must be true to use the static map
    first_map_only: False        # If true, it ignores map updates (good for static maps)
    set_initial_pose: True
    always_reset_initial_pose: True
    update_min_a: 0.1
    update_min_d: 0.1

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/cassian/geicar/jetsonNano/ros2_ws/src/geicar_start_jetson/maps/map_gei_213.yaml"

smoother_server:
  ros__parameters:
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_tolerance: 0.1
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      do_refinement: True
      refinement_num: 2
      max_its: 1000
      w_data: 0.2
      w_smooth: 0.3
      enforce_path_inversion: True

lifecycle_manager:
  ros__parameters:
    bond_timeout: 40.0