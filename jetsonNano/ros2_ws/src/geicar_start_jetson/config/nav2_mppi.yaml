controller_server:
  ros__parameters:
    use_sim_time: False
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Ackermann"
      ackermann_constraints:
        min_turning_r: 1.55
      vy_std: 0.0
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: true
      critics: ["ConstraintCritic", "ObstaclesCritic", "PathAlignCritic","GoalCritic","GoalAngleCritic", "PathFollowCritic", "PreferForwardCritic"]
      ObstaclesCritic:
        consider_footprint: true
      PathAlign:
        cost_weight: 10.0
        use_path_orientations: true
        threshold_to_consider: 0.8
        
      PreferForward:
        cost_weight: 3.0
        threshold_to_consider: 0.8

      Goal:
        cost_weight: 8.0
        threshold_to_consider: 1.0

      GoalAngle:
        cost_weight: 6.0
        threshold_to_consider: 1.0

      

planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      allow_unknown: false
      max_iterations: 1000000
      cache_obstacle_heuristic: true
      reverse_penalty: 0.3
      change_penalty: 1.0
      cost_penalty: 3.4
      non_straight_penalty: 1.0
      motion_model_for_search: "REEDS_SHEPP" 
      minimum_turning_radius: 1.522


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 0.5
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[ [0.66, 0.35], [0.66 0.15], [0.66 0.15], [0.8 0.15], [0.8 -0.08], [0.66 -0.08], [0.66, -0.35], [-0.66, -0.35], [-0.66, 0.35]  ]"
      resolution: 0.05
      track_unknown_space: false
      rolling_window: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.2
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[ [0.66, 0.35], [0.66 0.15], [0.66 0.15], [0.8 0.15], [0.8 -0.08], [0.66 -0.08], [0.66, -0.35], [-0.66, -0.35], [-0.66, 0.35]  ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.2
      always_send_full_costmap: True
bt_navigator:
  ros__parameters:
    bt_loop_duration: 100
amcl:
  ros__parameters:
    map_topic: map              
    use_map_topic: True           # Must be true to use the static map
    first_map_only_: False        # If true, it ignores map updates (good for static maps)
    set_initial_pose: True


map_server:
  ros__parameters:
    use_sim_time: false
