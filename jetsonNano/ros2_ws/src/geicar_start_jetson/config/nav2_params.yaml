controller_server:
  ros__parameters:
    controller_frequency: 10.0
    failure_tolerance: 0.3
    use_sim_time: False
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["goal_checker"] 
    
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35
      path_length_tolerance: 1.0
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_velocity: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.0 
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1
      use_approach_linear_velocity_scaling: true

      

planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      allow_unknown: false
      max_iterations: 1000000
      cache_obstacle_heuristic: true
      reverse_penalty: 2.0
      change_penalty: 0.2
      cost_penalty: 1.5
      non_straight_penalty: 2.0
      motion_model_for_search: "REEDS_SHEPP" 
      minimum_turning_radius: 1.6


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[ [0.66, 0.35], [0.66, 0.15], [0.9, 0.15], [0.9, -0.08], [0.66, -0.08], [0.66, -0.35], [-0.66, -0.35], [-0.66, 0.35]  ]"
      resolution: 0.05
      track_unknown_space: false
      rolling_window: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 0.6
      always_send_full_costmap: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[ [0.66, 0.35], [0.66, 0.15], [0.9, 0.15], [0.9, -0.08], [0.66, -0.08], [0.66, -0.35], [-0.66, -0.35], [-0.66, 0.35]  ]"
      plugins: ["obstacle_layer","inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 0.6
      always_send_full_costmap: false

bt_navigator:
  ros__parameters:
    bt_loop_duration: 100

amcl:
  ros__parameters:
    map_topic: map              
    use_map_topic: True           # Must be true to use the static map
    first_map_only: False        # If true, it ignores map updates (good for static maps)
    set_initial_pose: True
    always_reset_initial_pose: True
    update_min_a: 0.1
    update_min_d: 0.1

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/cassian/geicar/jetsonNano/ros2_ws/src/geicar_start_jetson/maps/gei_rdv_v1.yaml"

lifecycle_manager:
  ros__parameters:
    bond_timeout: 40.0